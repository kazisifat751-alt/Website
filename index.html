<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS PvP TierList</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f17; color: #fff; padding: 15px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        header { text-align: center; padding: 20px 0; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        h1 { color: #f59e0b; font-size: 2.2rem; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 0.95rem; }

        /* Mode Selection Tabs */
        .mode-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .mode-btn { background: #161b22; color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; white-space: nowrap; transition: 0.2s; }
        .mode-btn.active { background: #f59e0b; color: #000; border-color: #f59e0b; }

        /* MCTiers Style Columns Grid */
        .tier-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; align-items: start; }
        .tier-column { background: #111622; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; }
        
        .tier-header { padding: 12px; text-align: center; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.02); }
        .ht1 { color: #ef4444; border-bottom: 3px solid #ef4444; }
        .lt1 { color: #f97316; border-bottom: 3px solid #f97316; }
        .ht2 { color: #eab308; border-bottom: 3px solid #eab308; }
        .lt2 { color: #84cc16; border-bottom: 3px solid #84cc16; }
        .ht3 { color: #06b6d4; border-bottom: 3px solid #06b6d4; }
        .lt3 { color: #3b82f6; border-bottom: 3px solid #3b82f6; }

        .player-list { padding: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 500px; overflow-y: auto; }
        .player-row { display: flex; align-items: center; gap: 10px; background: #1a2130; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.04); }
        .player-row img { width: 32px; height: 32px; border-radius: 6px; background: #000; }
        .player-row span { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; }

        .empty-text { color: #475569; text-align: center; font-size: 0.85rem; padding: 15px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚔️ AS PvP TierList</h1>
        <p>Official Competitive Tier Columns</p>
    </header>

    <!-- Gamemode Tabs -->
    <div class="mode-bar" id="modeBar">
        <button class="mode-btn active" onclick="changeMode('Sword', this)">⚔️ Sword</button>
        <button class="mode-btn" onclick="changeMode('Axe', this)">🪓 Axe</button>
        <button class="mode-btn" onclick="changeMode('Mace', this)">🔨 Mace</button>
        <button class="mode-btn" onclick="changeMode('NethPot', this)">🧪 NethPot</button>
    </div>

    <!-- Columns Container -->
    <div class="tier-grid" id="tierGrid"></div>
</div>

<script>
    // প্লেয়ারদের ডাটা (এখানে নতুন প্লেয়ার ও টিয়ার যুক্ত করতে পারবে)
    const playersData = [
        { ign: "Death24", tiers: { Sword: "LT1", Axe: "HT2", Mace: "LT2" } },
        { ign: "Sifat", tiers: { Sword: "HT2", Axe: "LT1", NethPot: "HT3" } },
        { ign: "Technoblade", tiers: { Sword: "HT1", Axe: "HT1" } },
        { ign: "Dream", tiers: { Sword: "LT2", Axe: "HT3" } }
    ];

    let currentMode = 'Sword';
    const tiers = ["HT1", "LT1", "HT2", "LT2", "HT3", "LT3"];

    function changeMode(mode, btn) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderColumns();
    }

    function renderColumns() {
        const grid = document.getElementById('tierGrid');
        grid.innerHTML = '';

        tiers.forEach(tier => {
            // ওই মোডে নির্দিষ্ট টিয়ারের প্লেয়ারদের ফিল্টার করা
            const filtered = playersData.filter(p => p.tiers[currentMode] === tier);

            let playersHTML = '';
            if (filtered.length > 0) {
                playersHTML = filtered.map(p => `
                    <div class="player-row">
                        <img src="https://mc-heads.net/avatar/${p.ign}/32" onerror="this.src='https://mc-heads.net/avatar/Steve/32'">
                        <span>${p.ign}</span>
                    </div>
                `).join('');
            } else {
                playersHTML = `<div class="empty-text">No players</div>`;
            }

            grid.innerHTML += `
                <div class="tier-column">
                    <div class="tier-header ${tier.toLowerCase()}">Tier ${tier}</div>
                    <div class="player-list">${playersHTML}</div>
                </div>
            `;
        });
    }

    renderColumns();
</script>

</body>
</html>
