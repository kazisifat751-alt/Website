<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS PvP TierList</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f17; color: #fff; padding: 15px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 20px; }
        h1 { color: #f59e0b; font-size: 2.2rem; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 25px; background: #131722; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
        .tabs, .views { display: flex; gap: 6px; flex-wrap: wrap; }
        
        .btn { background: #1e2530; color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        .btn.active, .btn:hover { background: #3b82f6; color: #fff; border-color: #3b82f6; }

        /* Leaderboard View */
        .leaderboard-list { display: flex; flex-direction: column; gap: 10px; }
        .player-card { background: #131722; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
        .player-left { display: flex; align-items: center; gap: 14px; }
        .rank { font-size: 1.1rem; font-weight: bold; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #1e2530; color: #fbbf24; }
        .avatar { width: 42px; height: 42px; border-radius: 8px; background: #1a2130; }
        .info h3 { font-size: 1.1rem; margin-bottom: 2px; }
        .points { font-size: 0.85rem; color: #34d399; font-weight: bold; }
        
        .badges { display: flex; gap: 6px; flex-wrap: wrap; }
        .badge { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; color: #60a5fa; font-weight: bold; }

        /* MCTiers Exact Vertical Columns View */
        .tier-columns-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 15px;
            align-items: flex-start;
        }
        .tier-column {
            min-width: 260px;
            flex: 1;
            background: #111622;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            overflow: hidden;
        }
        .tier-header {
            padding: 14px;
            text-align: center;
            font-weight: 900;
            font-size: 1.1rem;
            background: rgba(255,255,255,0.03);
            border-bottom: 2px solid #3b82f6;
            color: #60a5fa;
            letter-spacing: 0.5px;
        }
        .tier-players-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 600px;
            overflow-y: auto;
        }
        .tier-player-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1a2130;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .tier-player-row img {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: #000;
        }
        .tier-player-row span {
            font-size: 0.95rem;
            font-weight: 700;
            color: #e2e8f0;
        }
        .empty-slot {
            color: #475569;
            text-align: center;
            font-size: 0.85rem;
            padding: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚔️ AS PvP TierList</h1>
        <p>Official Competitive Rankings & Tier Columns</p>
    </header>

    <div class="controls">
        <div class="tabs" id="modeTabs">
            <button class="btn active" onclick="setMode('overall', this)">🏆 Overall</button>
            <button class="btn" onclick="setMode('Sword', this)">⚔️ Sword</button>
            <button class="btn" onclick="setMode('Axe', this)">🪓 Axe</button>
            <button class="btn" onclick="setMode('Mace', this)">🔨 Mace</button>
            <button class="btn" onclick="setMode('NethPot', this)">🧪 NethPot</button>
        </div>

        <div class="views">
            <button class="btn active" id="lbBtn" onclick="switchView('leaderboard')">📊 Leaderboard</button>
            <button class="btn" id="colBtn" onclick="switchView('columns')">🧱 Tier Columns</button>
        </div>
    </div>

    <div id="content"></div>
</div>

<script>
    const pointsMap = { "HT1": 60, "LT1": 45, "HT2": 30, "LT2": 20, "HT3": 10, "LT3": 6, "HT4": 4, "LT4": 3 };
    
    const playersData = [
        { ign: "Technoblade", tiers: { Sword: "HT1", Axe: "HT1" } },
        { ign: "Death24", tiers: { Sword: "LT1", Axe: "HT2", Mace: "LT2" } },
        { ign: "Sifat", tiers: { Sword: "HT2", Axe: "LT1", NethPot: "HT3" } }
    ];

    let currentMode = 'overall';
    let currentView = 'leaderboard';

    function setMode(mode, btn) {
        currentMode = mode;
        document.querySelectorAll('#modeTabs .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function switchView(view) {
        currentView = view;
        document.getElementById('lbBtn').classList.toggle('active', view === 'leaderboard');
        document.getElementById('colBtn').classList.toggle('active', view === 'columns');
        render();
    }

    function render() {
        const container = document.getElementById('content');
        container.innerHTML = '';

        if (currentView === 'leaderboard') {
            let list = playersData.map(p => {
                let pts = 0;
                if (currentMode === 'overall') {
                    for (let m in p.tiers) pts += pointsMap[p.tiers[m]] || 0;
                } else {
                    pts = pointsMap[p.tiers[currentMode]] || 0;
                }
                return { ...p, pts };
            }).filter(p => p.pts > 0).sort((a, b) => b.pts - a.pts);

            let wrapper = document.createElement('div');
            wrapper.className = 'leaderboard-list';

            list.forEach((p, idx) => {
                let badges = '';
                for (let m in p.tiers) {
                    if (currentMode === 'overall' || currentMode === m) {
                        badges += `<div class="badge">${m}: ${p.tiers[m]}</div>`;
                    }
                }

                wrapper.innerHTML += `
                    <div class="player-card">
                        <div class="player-left">
                            <div class="rank">#${idx + 1}</div>
                            <img class="avatar" src="https://mc-heads.net/avatar/${p.ign}/42" onerror="this.src='https://mc-heads.net/avatar/Steve/42'">
                            <div class="info">
                                <h3>${p.ign}</h3>
                                <div class="points">Points: ${p.pts}</div>
                            </div>
                        </div>
                        <div class="badges">${badges}</div>
                    </div>
                `;
            });
            container.appendChild(wrapper);

        } else {
            if (currentMode === 'overall') {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:30px;">Please select a specific gamemode (Sword, Axe, etc.) above to view Tier Columns.</p>';
                return;
            }

            const tiers = ["HT1", "LT1", "HT2", "LT2", "HT3", "LT3", "HT4", "LT4"];
            let containerDiv = document.createElement('div');
            containerDiv.className = 'tier-columns-container';

            tiers.forEach(tier => {
                let filtered = playersData.filter(p => p.tiers[currentMode] === tier);
                let rowsHTML = filtered.length > 0 ? filtered.map(p => `
                    <div class="tier-player-row">
                        <img src="https://mc-heads.net/avatar/${p.ign}/36" onerror="this.src='https://mc-heads.net/avatar/Steve/36'">
                        <span>${p.ign}</span>
                    </div>
                `).join('') : `<div class="empty-slot">No players</div>`;

                containerDiv.innerHTML += `
                    <div class="tier-column">
                        <div class="tier-header">Tier ${tier}</div>
                        <div class="tier-players-list">${rowsHTML}</div>
                    </div>
                `;
            });
            container.appendChild(containerDiv);
        }
    }

    render();
</script>

</body>
</html>
