<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS PvP TierList</title>
    <style>
        body { background: #090b10; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #60a5fa; margin-bottom: 5px; }
        p { text-align: center; color: #94a3b8; margin-bottom: 25px; }
        
        .controls { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; background: #131722; padding: 15px; border-radius: 10px; }
        .tabs button { background: #1e2530; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .tabs button.active { background: #3b82f6; }
        
        .player-card { background: #131722; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .player-left { display: flex; align-items: center; gap: 15px; }
        .rank { font-size: 1.2rem; font-weight: bold; width: 35px; height: 35px; background: #1e2530; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #fbbf24; }
        .avatar { width: 40px; height: 40px; border-radius: 6px; }
        .info h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .points { font-size: 0.85rem; color: #34d399; }
        
        .badges { display: flex; gap: 6px; }
        .badge { background: rgba(59,130,246,0.2); border: 1px solid #3b82f6; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; color: #60a5fa; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚔️ AS PvP TierList</h1>
    <p>Official Competitive Rankings</p>

    <div class="controls">
        <div class="tabs" id="modeTabs">
            <button class="active" onclick="setMode('overall', this)">Overall</button>
            <button onclick="setMode('Sword', this)">Sword</button>
            <button onclick="setMode('Axe', this)">Axe</button>
            <button onclick="setMode('Mace', this)">Mace</button>
        </div>
    </div>

    <div id="leaderboard"></div>
</div>

<script>
    const pointsMap = { "HT1": 60, "LT1": 45, "HT2": 30, "LT2": 20, "HT3": 10, "LT3": 6 };
    
    const players = [
        { ign: "Death24", tiers: { "Sword": "LT1", "Axe": "HT2", "Mace": "LT2" } },
        { ign: "Sifat", tiers: { "Sword": "HT2", "Axe": "LT1", "NethPot": "HT3" } },
        { ign: "Technoblade", tiers: { "Sword": "HT1", "Axe": "HT1" } }
    ];

    let currentMode = 'overall';

    function setMode(mode, btn) {
        currentMode = mode;
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function render() {
        const container = document.getElementById('leaderboard');
        container.innerHTML = '';

        let list = players.map(p => {
            let pts = 0;
            if (currentMode === 'overall') {
                for (let m in p.tiers) pts += pointsMap[p.tiers[m]] || 0;
            } else {
                pts = pointsMap[p.tiers[currentMode]] || 0;
            }
            return { ...p, pts };
        }).filter(p => p.pts > 0).sort((a, b) => b.pts - a.pts);

        list.forEach((p, idx) => {
            let badges = '';
            for (let m in p.tiers) {
                if (currentMode === 'overall' || currentMode === m) {
                    badges += `<div class="badge">${m}: ${p.tiers[m]}</div>`;
                }
            }

            container.innerHTML += `
                <div class="player-card">
                    <div class="player-left">
                        <div class="rank">#${idx + 1}</div>
                        <img class="avatar" src="https://mc-heads.net/avatar/${p.ign}/40" onerror="this.src='https://mc-heads.net/avatar/Steve/40'">
                        <div class="info">
                            <h3>${p.ign}</h3>
                            <div class="points">Points: ${p.pts}</div>
                        </div>
                    </div>
                    <div class="badges">${badges}</div>
                </div>
            `;
        });
    }

    render();
</script>

</body>
</html>
