<html lang="en">
<head>

        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; }

        header p { color: #94a3b8; font-size: 1rem; }
        
        .controls { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; background: #131722; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .tab-btn { background: #1e2530; color: #94a3b8; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.2s; }

        .search-box { background: #090b10; border: 1px solid rgba(255,255,255,0.15); padding: 10px 15px; border-radius: 8px; color: #fff; width: 100%; max-width: 250px; outline: none; }
        
        .player-card { background: #131722; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; transition: 0.2s; }
        .player-card:hover { transform: translateY(-2px); border-color: rgba(168,85,247,0.4); background: #181f2e; }
        
        .player-left { display: flex; align-items: center; gap: 16px; }
        .rank { font-size: 1.3rem; font-weight: 900; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1e2530; color: #94a3b8; }
        .rank-1 { background: #fbbf24; color: #000; box-shadow: 0 0 15px rgba(251,191,36,0.5); }
        .rank-2 { background: #cbd5e1; color: #000; }
        .rank-3 { background: #f97316; color: #fff; }
        
        .avatar { width: 45px; height: 45px; border-radius: 8px; background: #1e2530; }
        .info h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 3px; }
        .points { font-size: 0.9rem; color: #94a3b8; }
        .points span { color: #34d399; font-weight: 700; }
        
        .tiers { display: flex; gap: 8px; flex-wrap: wrap; }
        .badge { padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 700; background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
    </style>
</head>

        </div>
        <input type="text" class="search-box" id="search" placeholder="Search player..." onkeyup="render()">
    </div>

    <div id="leaderboard"></div>
</div>
